<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>K'Cho Shelter — Ticket Tracker</title>
  <meta name="description" content="Raffle ticket and book record for the K'Cho Shelter fundraiser">
  <meta name="theme-color" content="#0d7a6f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">

  <!-- Google Identity Services. The client ID it uses is public by design; the
       protection is the Authorized JavaScript origins list on Google's side. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app"></div>
  <noscript>This record needs JavaScript switched on.</noscript>
  <script type="module" src="/src/main.js"></script>

  <!--
    Safety net. If the app has not painted after a few seconds, say why in
    words instead of leaving a blank page and a console error.

    The usual cause is this file being served straight from the repository:
    it is Vite's template, and "/src/main.js" only resolves after a build. In
    that state the browser reports 'Failed to resolve module specifier "vue"',
    which tells the person looking at it nothing at all.
  -->
  <script>
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.children.length) return;
      app.innerHTML =
        '<div style="max-width:34rem;margin:12vh auto;padding:0 1.5rem;' +
        'font:16px/1.6 -apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;' +
        'color:#12161c">' +
        '<div style="font-size:2.6rem">🛠️</div>' +
        '<h1 style="font-size:1.4rem;margin:.4em 0">This page has not been built yet</h1>' +
        '<p>The app is fine — what is being served here is the template, not the finished page.</p>' +
        '<p><b>To fix it:</b> in this repository on GitHub go to ' +
        '<b>Settings → Pages</b>, and under <b>Build and deployment</b> set ' +
        '<b>Source</b> to <b>GitHub Actions</b> (not "Deploy from a branch"). ' +
        'Then push any change, or re-run the latest workflow.</p>' +
        '<p style="color:#5d6775;font-size:.9rem">If you are running this on your own ' +
        'computer, use <code>npm run dev</code> rather than opening the file directly.</p>' +
        '</div>';
    }, 5000);
  </script>
</body>
</html>

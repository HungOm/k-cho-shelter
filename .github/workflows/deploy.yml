# Builds and publishes on every push to master, so nobody has to remember to
# run `npm run build` before deploying.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: ./tests/run.sh

      # Baked into the build so an ordinary volunteer opens the site and signs
      # in — no setup link, no fragment to paste, nothing per device.
      #
      # The publishable key belongs here. It is the PUBLIC half of the pair and
      # ships inside the bundle either way; what protects the data is row-level
      # security in the database, for the signed-in person. The sb_secret_ key
      # is the one that must never appear in a build, a repo or a browser.
      #
      # Read from repository VARIABLES rather than written here, so the values
      # live in one place the organisation controls and this file carries none
      # of them. Unset means the device falls back to a per-device setup link,
      # so a missing variable degrades rather than breaks.
      #
      # VITE_BACKEND used to be here and chose between two backends. There is
      # one now. If the repository variable still exists it is read by nothing —
      # delete it, so the next person does not go looking for what it does.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
